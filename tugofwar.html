<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tarik Tambang Perkalian - Interaktiv-ta'lim</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* =====================================================
       DESIGN TOKENS (Interaktiv-ta'lim)
    ===================================================== */
    :root {
      --color-primary: #0284C5;
      --color-secondary: #60A5FA;
      --color-tertiary: #F59E0B;
      /* Background Disamakan Dengan Latar GIF Canvas */
      --color-bg-canvas: #EDEDED; 
      --color-surface: #FFFFFF;
      --color-on-surface: #0F172A;
      --color-border: #CBD5E1;
      --color-error: #EF4444;

      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      --font-main: 'Nunito', sans-serif;
      --font-display: 'Fredoka', 'Nunito', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      font-family: var(--font-main);
      /* Menyelaraskan Latar Belakang Web Dengan Background GIF */
      background-color: var(--color-bg-canvas);
      color: var(--color-on-surface);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    /* =====================================================
       TIRAI OPENING
    ===================================================== */
    .curtain {
      position: fixed;
      top: 0;
      width: 50vw;
      height: 100vh;
      background: repeating-linear-gradient(90deg, #F43F5E 0px, #EF4444 30px, #DC2626 60px, #EF4444 90px);
      z-index: 100;
      transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
      box-shadow: inset 0 0 50px rgba(15, 23, 42, 0.25);
    }

    .curtain-left { left: 0; border-right: 8px solid #B91C1C; }
    .curtain-right { right: 0; border-left: 8px solid #B91C1C; }

    .curtain-open .curtain-left { transform: translateX(-100%); }
    .curtain-open .curtain-right { transform: translateX(100%); }

    /* =====================================================
       HEADER
    ===================================================== */
    header {
      width: 100%;
      max-width: 1200px;
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .btn-back {
      text-decoration: none;
      background-color: var(--color-surface);
      color: var(--color-primary);
      font-family: var(--font-main);
      font-weight: 700;
      font-size: 15px;
      padding: 8px 20px;
      border-radius: var(--radius-lg);
      border: 2px solid var(--color-border);
      box-shadow: 0 4px 10px rgba(2, 132, 197, 0.12);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background-color: var(--color-primary);
      color: var(--color-surface);
      border-color: var(--color-primary);
    }

    .game-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--color-primary);
      background-color: var(--color-surface);
      padding: 6px 20px;
      border-radius: var(--radius-full);
      border: 2px solid var(--color-border);
    }

    /* =====================================================
       GAME ARENA LAYOUT (KEYPAD FRONT, GIF BACK)
    ===================================================== */
    .game-arena {
      width: 100%;
      max-width: 1250px;
      height: calc(100vh - 80px);
      display: grid;
      grid-template-columns: 320px 1fr 320px;
      gap: 1.5rem;
      padding: 0 1.5rem 1rem 1.5rem;
      align-items: center;
      position: relative;
    }

    /* =====================================================
       PLAYER CARD & KEYPAD (Z-INDEX TINGGI = DI DEPAN GIF)
    ===================================================== */
    .player-card {
      background-color: var(--color-surface);
      border-radius: var(--radius-xl);
      border: 2px solid var(--color-border);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10; /* Berada di depan GIF */
    }

    .card-header-blue {
      width: 100%;
      background-color: var(--color-primary);
      color: var(--color-surface);
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-header-red {
      width: 100%;
      background-color: var(--color-error);
      color: var(--color-surface);
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .player-name {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
    }

    .score-badge {
      font-family: var(--font-display);
      background-color: rgba(255, 255, 255, 0.25);
      padding: 2px 10px;
      border-radius: var(--radius-full);
      font-size: 14px;
    }

    .question-display {
      font-family: var(--font-display);
      font-size: 30px;
      font-weight: 700;
      margin: 8px 0;
      color: var(--color-on-surface);
    }

    .answer-box {
      width: 85%;
      height: 44px;
      background-color: var(--color-bg-canvas);
      border: 2px solid var(--color-border);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 24px;
      color: var(--color-on-surface);
      margin-bottom: 12px;
    }

    .keypad-grid {
      width: 85%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding-bottom: 16px;
    }

    .key-btn {
      height: 42px;
      background-color: var(--color-bg-canvas);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      color: var(--color-on-surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
      box-shadow: 0 3px 0 var(--color-border);
    }

    .key-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--color-border);
    }

    .key-clear {
      background-color: #FFE4E6;
      color: var(--color-error);
      border-color: #FECDD3;
    }

    .key-submit-blue {
      background-color: var(--color-primary);
      color: var(--color-surface);
      border-color: #0369A1;
      box-shadow: 0 3px 0 #0369A1;
    }

    .key-submit-red {
      background-color: var(--color-error);
      color: var(--color-surface);
      border-color: #B91C1C;
      box-shadow: 0 3px 0 #B91C1C;
    }

    /* =====================================================
       STAGE TENGAH (GIF BERADA DI PALING BELAKANG z-index: 1)
    ===================================================== */
    .tug-stage {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .gif-background {
      position: absolute;
      width: 100%;
      max-width: 550px;
      height: auto;
      object-fit: contain;
      z-index: 1; /* Paling belakang */
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @media (max-width: 900px) {
      body { overflow-y: auto; height: auto; }
      .game-arena { grid-template-columns: 1fr; height: auto; }
      .tug-stage { height: 260px; }
    }
  </style>
</head>

<body>

  <div class="curtain curtain-left"></div>
  <div class="curtain curtain-right"></div>

  <header>
    <a href="index.html" class="btn-back">
      <span>⬅️</span> Kembali
    </a>
    <h1 class="game-title">Tarik Tambang Perkalian</h1>
    <div style="width: 100px;"></div>
  </header>

  <main class="game-arena">

    <section class="player-card">
      <div class="card-header-blue">
        <h2 class="player-name">TIM BIRU</h2>
        <span class="score-badge" id="score-left">Skor: 0</span>
      </div>
      <div class="question-display" id="q-left">? × ?</div>
      <div class="answer-box" id="ans-left"></div>

      <div class="keypad-grid">
        <button class="key-btn" onclick="pressKey('left', '1')">1</button>
        <button class="key-btn" onclick="pressKey('left', '2')">2</button>
        <button class="key-btn" onclick="pressKey('left', '3')">3</button>
        <button class="key-btn" onclick="pressKey('left', '4')">4</button>
        <button class="key-btn" onclick="pressKey('left', '5')">5</button>
        <button class="key-btn" onclick="pressKey('left', '6')">6</button>
        <button class="key-btn" onclick="pressKey('left', '7')">7</button>
        <button class="key-btn" onclick="pressKey('left', '8')">8</button>
        <button class="key-btn" onclick="pressKey('left', '9')">9</button>
        <button class="key-btn key-clear" onclick="pressKey('left', 'C')">C</button>
        <button class="key-btn" onclick="pressKey('left', '0')">0</button>
        <button class="key-btn key-submit-blue" onclick="pressKey('left', 'OK')">OK</button>
      </div>
    </section>

    <section class="tug-stage">
      <img src="player-pull.gif" alt="Arena Tarik Tambang" class="gif-background" id="stageGif" />
    </section>

    <section class="player-card">
      <div class="card-header-red">
        <h2 class="player-name">TIM MERAH</h2>
        <span class="score-badge" id="score-right">Skor: 0</span>
      </div>
      <div class="question-display" id="q-right">? × ?</div>
      <div class="answer-box" id="ans-right"></div>

      <div class="keypad-grid">
        <button class="key-btn" onclick="pressKey('right', '1')">1</button>
        <button class="key-btn" onclick="pressKey('right', '2')">2</button>
        <button class="key-btn" onclick="pressKey('right', '3')">3</button>
        <button class="key-btn" onclick="pressKey('right', '4')">4</button>
        <button class="key-btn" onclick="pressKey('right', '5')">5</button>
        <button class="key-btn" onclick="pressKey('right', '6')">6</button>
        <button class="key-btn" onclick="pressKey('right', '7')">7</button>
        <button class="key-btn" onclick="pressKey('right', '8')">8</button>
        <button class="key-btn" onclick="pressKey('right', '9')">9</button>
        <button class="key-btn key-clear" onclick="pressKey('right', 'C')">C</button>
        <button class="key-btn" onclick="pressKey('right', '0')">0</button>
        <button class="key-btn key-submit-red" onclick="pressKey('right', 'OK')">OK</button>
      </div>
    </section>

  </main>

  <script>
    // Bank Soal Perkalian Kelas 3 (Halaman 58–63)
    const questionBank = [
      { num1: 5, num2: 2, ans: 10 },
      { num1: 4, num2: 5, ans: 20 },
      { num1: 5, num2: 6, ans: 30 },
      { num1: 6, num2: 5, ans: 30 },
      { num1: 5, num2: 4, ans: 20 },
      { num1: 6, num2: 2, ans: 12 },
      { num1: 6, num2: 5, ans: 30 },
      { num1: 8, num2: 4, ans: 32 },
      { num1: 7, num2: 3, ans: 21 },
      { num1: 9, num2: 4, ans: 36 },
      { num1: 3, num2: 8, ans: 24 },
      { num1: 7, num2: 5, ans: 35 },
      { num1: 8, num2: 5, ans: 40 },
      { num1: 4, num2: 7, ans: 28 },
      { num1: 6, num2: 6, ans: 36 }
    ];

    let currentQLeft = {};
    let currentQRight = {};
    let inputLeft = "";
    let inputRight = "";
    let scoreLeft = 0;
    let scoreRight = 0;
    let pullPos = 0; // Posisi pergeseran GIF

    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        document.body.classList.add("curtain-open");
      }, 200);

      // Inisialisasi Soal Awal
      generateNewQuestion('left');
      generateNewQuestion('right');
    });

    // Acak & Tampilkan Soal Baru
    function generateNewQuestion(side) {
      const randomQ = questionBank[Math.floor(Math.random() * questionBank.length)];
      if (side === 'left') {
        currentQLeft = randomQ;
        document.getElementById('q-left').innerText = `${randomQ.num1} × ${randomQ.num2} = ?`;
      } else {
        currentQRight = randomQ;
        document.getElementById('q-right').innerText = `${randomQ.num1} × ${randomQ.num2} = ?`;
      }
    }

    // Suara Efek Klik / Jawab
    function playBeep(freq = 600) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.1);
    }

    // Logika Keypad Input
    function pressKey(side, val) {
      playBeep(800);

      if (side === 'left') {
        const box = document.getElementById('ans-left');
        if (val === 'C') {
          inputLeft = "";
        } else if (val === 'OK') {
          if (parseInt(inputLeft) === currentQLeft.ans) {
            playBeep(1200);
            scoreLeft += 10;
            pullPos -= 35; // Tarik ke kiri
            document.getElementById('score-left').innerText = `Skor: ${scoreLeft}`;
            document.getElementById('stageGif').style.transform = `translateX(${pullPos}px)`;
            inputLeft = "";
            generateNewQuestion('left'); // GANTI SOAL BARU
          } else {
            playBeep(300);
            inputLeft = "";
          }
        } else {
          if (inputLeft.length < 3) inputLeft += val;
        }
        box.innerText = inputLeft;
      } else {
        const box = document.getElementById('ans-right');
        if (val === 'C') {
          inputRight = "";
        } else if (val === 'OK') {
          if (parseInt(inputRight) === currentQRight.ans) {
            playBeep(1200);
            scoreRight += 10;
            pullPos += 35; // Tarik ke kanan
            document.getElementById('score-right').innerText = `Skor: ${scoreRight}`;
            document.getElementById('stageGif').style.transform = `translateX(${pullPos}px)`;
            inputRight = "";
            generateNewQuestion('right'); // GANTI SOAL BARU
          } else {
            playBeep(300);
            inputRight = "";
          }
        } else {
          if (inputRight.length < 3) inputRight += val;
        }
        box.innerText = inputRight;
      }
    }
  </script>

</body>
</html>
