<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tug of War - Matematika</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Animate.css untuk animasi -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            color: #f8fafc;
        }

        .font-game {
            font-family: 'Fredoka One', cursive;
        }

        /* Area Arena Tarik Tambang */
        .rope-container {
            position: relative;
            width: 100%;
            height: 160px;
            background: linear-gradient(to bottom, #334155, #1e293b);
            border-y: 6px solid #475569;
            overflow: hidden;
        }

        .rope {
            position: absolute;
            top: 50%;
            left: 0;
            width: 200%;
            height: 14px;
            background: repeating-linear-gradient(45deg, #d97706, #d97706 15px, #b45309 15px, #b45309 30px);
            transform: translateY(-50%);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .center-marker {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 4px;
            background-color: #f59e0b;
            transform: translateX(-50%);
            z-index: 10;
        }

        .center-marker::before, .center-marker::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
        }
        .center-marker::before { top: 0; border-top: 14px solid #f59e0b; }
        .center-marker::after { bottom: 0; border-bottom: 14px solid #f59e0b; }

        .rope-ribbon {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 40px;
            background-color: #ef4444;
            transform: translate(-50%, -50%);
            border-radius: 4px;
            z-index: 12;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
        }

        .team-puller {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 3.5rem;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 11;
            filter: drop-shadow(0 10px 8px rgba(0,0,0,0.4));
        }

        /* Custom Card styling */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between p-2 md:p-4">

    <!-- Header & Status Game -->
    <header class="w-full max-w-5xl mx-auto text-center mb-2">
        <h1 class="text-3xl md:text-5xl font-game tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-orange-400 to-yellow-300 drop-shadow-lg">
            TUG OF WAR MATEMATIKA
        </h1>
    </header>

    <!-- Main Content Area -->
    <main class="w-full max-w-5xl mx-auto flex-grow flex flex-col justify-center">

        <!-- SCOREBOARD & ATURAN SKOR (Dibuat Lebih Rapat Ke Tengah) -->
        <div class="grid grid-cols-12 gap-2 md:gap-3 items-center mb-4 max-w-4xl mx-auto w-full px-2">
            
            <!-- Card Tim Merah (Span 4) -->
            <div class="col-span-4 glass-card rounded-2xl p-3 md:p-4 text-center border-l-4 border-red-500 shadow-lg transition-transform hover:scale-105">
                <div class="flex items-center justify-center gap-2 mb-1">
                    <i class="fa-solid fa-users text-red-500 text-lg md:text-xl"></i>
                    <span class="font-game text-red-400 text-sm md:text-xl">TIM MERAH</span>
                </div>
                <div id="score-red" class="text-3xl md:text-5xl font-game text-white tracking-wider">0</div>
            </div>

            <!-- Card Ketentuan Skor & Info Game (Span 4 - Di Tengah Antara Tim) -->
            <div class="col-span-4 glass-card rounded-2xl p-2 md:p-3 text-center border-y-2 border-amber-500/50 shadow-md">
                <div class="text-amber-400 font-bold text-xs md:text-sm uppercase tracking-wider mb-1">
                    <i class="fa-solid fa-scroll mr-1"></i> Ketentuan Skor
                </div>
                <div class="text-[10px] md:text-xs text-slate-300 space-y-0.5 leading-tight">
                    <p class="text-emerald-400 font-semibold"><i class="fa-solid fa-circle-check mr-0.5"></i> Benar: <span class="text-white">+10 Skor</span></p>
                    <p class="text-rose-400 font-semibold"><i class="fa-solid fa-circle-xmark mr-0.5"></i> Salah: <span class="text-white">-5 Skor</span></p>
                    <p class="text-amber-300 text-[9px] md:text-[11px] mt-1 pt-1 border-t border-slate-700/60">
                        Tarik tali hingga ujung lawan untuk menang!
                    </p>
                </div>
            </div>

            <!-- Card Tim Biru (Span 4) -->
            <div class="col-span-4 glass-card rounded-2xl p-3 md:p-4 text-center border-r-4 border-blue-500 shadow-lg transition-transform hover:scale-105">
                <div class="flex items-center justify-center gap-2 mb-1">
                    <span class="font-game text-blue-400 text-sm md:text-xl">TIM BIRU</span>
                    <i class="fa-solid fa-users text-blue-500 text-lg md:text-xl"></i>
                </div>
                <div id="score-blue" class="text-3xl md:text-5xl font-game text-white tracking-wider">0</div>
            </div>

        </div>

        <!-- ARENA TARIK TAMBANG -->
        <div class="rope-container rounded-2xl mb-6 shadow-2xl">
            <div class="center-marker"></div>
            <!-- Tali Tambang -->
            <div id="rope" class="rope">
                <div class="rope-ribbon"></div>
            </div>
            <!-- Karakter Tim Merah -->
            <div id="puller-red" class="team-puller text-red-500" style="left: 20%;">
                <i class="fa-solid fa-person-pulling"></i>
            </div>
            <!-- Karakter Tim Biru -->
            <div id="puller-blue" class="team-puller text-blue-500" style="right: 20%; transform: translateY(-50%) scaleX(-1);">
                <i class="fa-solid fa-person-pulling"></i>
            </div>
        </div>

        <!-- AREA SOAL & INTERAKSI PERMAINAN -->
        <div id="game-zone" class="glass-card rounded-3xl p-4 md:p-6 shadow-2xl relative overflow-hidden">
            
            <!-- Turn Indicator -->
            <div class="flex justify-between items-center mb-4">
                <span id="turn-badge" class="px-4 py-1.5 rounded-full text-xs md:text-sm font-bold uppercase tracking-wider bg-red-500/20 text-red-400 border border-red-500/40 animate-pulse">
                    Giliran: Tim Merah
                </span>
                <div class="text-slate-400 text-xs md:text-sm">
                    <i class="fa-solid fa-stopwatch text-amber-400 mr-1"></i> Waktu: <span id="timer" class="font-mono text-white font-bold">15</span>s
                </div>
            </div>

            <!-- Tampilan Soal -->
            <div class="text-center py-4 bg-slate-900/60 rounded-2xl border border-slate-700/50 mb-6 shadow-inner">
                <div id="question" class="text-3xl md:text-5xl font-game tracking-wide text-white">
                    12 + 15 = ?
                </div>
            </div>

            <!-- Opsi Jawaban -->
            <div id="options-container" class="grid grid-cols-2 gap-3 md:gap-4">
                <!-- Tombol Opsi Jawaban di-generate via JavaScript -->
            </div>

        </div>

    </main>

    <!-- Modal Pemenang (Game Over) -->
    <div id="winner-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center z-50 p-4">
        <div class="glass-card max-w-md w-full rounded-3xl p-6 text-center border-2 border-amber-500/50 shadow-2xl animate__animated animate__zoomIn">
            <div class="text-6xl mb-4" id="winner-icon">🏆</div>
            <h2 id="winner-title" class="text-3xl font-game text-amber-400 mb-2">TIM MERAH MENANG!</h2>
            <p id="winner-desc" class="text-slate-300 text-sm mb-6">Selamat! Tim Anda berhasil menarik tali sampai ke batas kemenangan.</p>
            
            <button onclick="resetGame()" class="w-full py-3.5 px-6 rounded-xl font-game text-slate-900 bg-gradient-to-r from-amber-400 to-orange-400 hover:from-amber-300 hover:to-orange-300 transition-all shadow-lg hover:shadow-orange-500/30 text-lg">
                <i class="fa-solid fa-rotate-right mr-2"></i> MAIN LAGI
            </button>
        </div>
    </div>

    <!-- Script Logika Permainan -->
    <script>
        // State Game
        let scoreRed = 0;
        let scoreBlue = 0;
        let ropePosition = 0; // -100 (Merah Menang) sampai +100 (Biru Menang)
        let currentTurn = 'red'; // 'red' atau 'blue'
        let currentAnswer = 0;
        let timer = 15;
        let timerInterval = null;
        const WIN_THRESHOLD = 50; // Posisi tali untuk menang

        // Inisialisasi Game
        function initGame() {
            scoreRed = 0;
            scoreBlue = 0;
            ropePosition = 0;
            currentTurn = 'red';
            updateUI();
            nextQuestion();
            document.getElementById('winner-modal').classList.add('hidden');
        }

        // Generate Soal Matematika Acak
        function generateQuestion() {
            const operators = ['+', '-', '×'];
            const op = operators[Math.floor(Math.random() * operators.length)];
            let a, b, ans;

            if (op === '+') {
                a = Math.floor(Math.random() * 50) + 1;
                b = Math.floor(Math.random() * 50) + 1;
                ans = a + b;
            } else if (op === '-') {
                a = Math.floor(Math.random() * 50) + 20;
                b = Math.floor(Math.random() * a) + 1;
                ans = a - b;
            } else {
                a = Math.floor(Math.random() * 12) + 1;
                b = Math.floor(Math.random() * 10) + 1;
                ans = a * b;
            }

            return { question: `${a} ${op} ${b}`, answer: ans };
        }

        // Tampilkan Soal Berikutnya
        function nextQuestion() {
            resetTimer();
            const qData = generateQuestion();
            currentAnswer = qData.answer;

            document.getElementById('question').innerText = `${qData.question} = ?`;

            // Buat Pilihan Jawaban
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            let options = [currentAnswer];
            while (options.length < 4) {
                let wrongAns = currentAnswer + (Math.floor(Math.random() * 20) - 10);
                if (wrongAns !== currentAnswer && !options.includes(wrongAns)) {
                    options.push(wrongAns);
                }
            }

            // Acak Opsi
            options.sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'py-3.5 px-4 rounded-xl font-game text-xl md:text-2xl bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700/80 transition-all transform hover:-translate-y-0.5 active:translate-y-0 shadow-md';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt);
                optionsContainer.appendChild(btn);
            });

            startTimer();
        }

        // Jalankan Timer
        function startTimer() {
            timer = 15;
            document.getElementById('timer').innerText = timer;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timer--;
                document.getElementById('timer').innerText = timer;
                if (timer <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
        }

        // Ketika Waktu Habis
        function handleTimeout() {
            applyScore(currentTurn, -5);
            switchTurn();
            nextQuestion();
        }

        // Cek Jawaban Pemain
        function checkAnswer(selectedOpt) {
            resetTimer();
            if (selectedOpt === currentAnswer) {
                // Jawaban Benar
                applyScore(currentTurn, 10);
                moveRope(currentTurn === 'red' ? -10 : 10);
            } else {
                // Jawaban Salah
                applyScore(currentTurn, -5);
            }

            if (!checkWinner()) {
                switchTurn();
                nextQuestion();
            }
        }

        // Terapkan Perubahan Skor
        function applyScore(team, points) {
            if (team === 'red') {
                scoreRed = Math.max(0, scoreRed + points);
            } else {
                scoreBlue = Math.max(0, scoreBlue + points);
            }
            updateUI();
        }

        // Beralih Giliran
        function switchTurn() {
            currentTurn = currentTurn === 'red' ? 'blue' : 'red';
            const badge = document.getElementById('turn-badge');
            
            if (currentTurn === 'red') {
                badge.className = 'px-4 py-1.5 rounded-full text-xs md:text-sm font-bold uppercase tracking-wider bg-red-500/20 text-red-400 border border-red-500/40 animate-pulse';
                badge.innerText = 'Giliran: Tim Merah';
            } else {
                badge.className = 'px-4 py-1.5 rounded-full text-xs md:text-sm font-bold uppercase tracking-wider bg-blue-500/20 text-blue-400 border border-blue-500/40 animate-pulse';
                badge.innerText = 'Giliran: Tim Biru';
            }
        }

        // Gerakkan Tali
        function moveRope(delta) {
            ropePosition += delta;
            // Batasi Rentang Pergerakan
            ropePosition = Math.max(-WIN_THRESHOLD, Math.min(WIN_THRESHOLD, ropePosition));
            updateUI();
        }

        // Perbarui Tampilan Visual (UI)
        function updateUI() {
            document.getElementById('score-red').innerText = scoreRed;
            document.getElementById('score-blue').innerText = scoreBlue;

            // Update posisi tali visual
            const ropeElem = document.getElementById('rope');
            const percentOffset = (ropePosition / WIN_THRESHOLD) * 25; // pergerakan maksimal %
            ropeElem.style.transform = `translate(calc(-25% + ${percentOffset}%), -50%)`;
        }

        // Cek Pemenang
        function checkWinner() {
            let winner = null;
            if (ropePosition <= -WIN_THRESHOLD) {
                winner = 'Tim Merah';
            } else if (ropePosition >= WIN_THRESHOLD) {
                winner = 'Tim Biru';
            }

            if (winner) {
                resetTimer();
                showWinnerModal(winner);
                return true;
            }
            return false;
        }

        // Tampilkan Modal Kemenangan
        function showWinnerModal(winner) {
            const modal = document.getElementById('winner-modal');
            const title = document.getElementById('winner-title');
            const icon = document.getElementById('winner-icon');
            const desc = document.getElementById('winner-desc');

            if (winner === 'Tim Merah') {
                title.innerText = 'TIM MERAH MENANG!';
                title.className = 'text-3xl font-game text-red-400 mb-2';
                icon.innerText = '🔴';
                desc.innerText = `Tim Merah memenangkan pertandingan dengan skor ${scoreRed}!`;
            } else {
                title.innerText = 'TIM BIRU MENANG!';
                title.className = 'text-3xl font-game text-blue-400 mb-2';
                icon.innerText = '🔵';
                desc.innerText = `Tim Biru memenangkan pertandingan dengan skor ${scoreBlue}!`;
            }

            modal.classList.remove('hidden');
        }

        // Reset Game
        function resetGame() {
            initGame();
        }

        // Jalankan Game saat Halaman Selesai Dimuat
        window.onload = initGame;
    </script>
</body>
</html>
