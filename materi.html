<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materi Pembelajaran - Perkalian Bilangan Cacah</title>
  
  <style>
    /* Reset default margin & padding */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Set HTML & Body memenuhi 100% tinggi dan lebar layar */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Sembunyikan scrollbar agar benar-benar full screen */
      background-color: #000000; /* Latar belakang hitam khas tampilan presentasi */
    }

    /* Container Canva Fullscreen */
    .fullscreen-canva {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }

    /* Frame iFrame memenuhi layar */
    .fullscreen-canva iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="fullscreen-canva">
    <iframe 
      loading="lazy" 
      src="https://www.canva.com/design/DAHUgi7gx7k/rYDtfhVSuhQCozaLm8mRrA/view?embed" 
      allowfullscreen="allowfullscreen" 
      allow="fullscreen">
    </iframe>
  </div>

</body>
</html>
