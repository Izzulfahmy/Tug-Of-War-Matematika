<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Pembelajaran Matematika - Perkalian Kelas 3</title>
  <!-- Google Fonts: Fredoka & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  
  <style>
    /* ===================================================
       1. RESET & BASE STYLES
       =================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      /* Background Polkadot Ceria & Fresh */
      background-color: #e0f2fe;
      background-image: radial-gradient(#38bdf8 2px, transparent 2px), radial-gradient(#38bdf8 2px, #e0f2fe 2px);
      background-size: 50px 50px;
      background-position: 0 0, 25px 25px;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    /* ===================================================
       2. HEADER & JUDUL UTAMA
       =================================================== */
    .header-container {
      text-align: center;
      max-width: 800px;
      width: 100%;
      margin-bottom: 1rem;
    }

    .badge-top {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: #ffffff;
      color: #0284c7;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      padding: 0.5rem 1.4rem;
      border-radius: 50px;
      border: 3.5px solid #38bdf8;
      box-shadow: 0 5px 0 #0284c7;
      margin-bottom: 0.8rem;
    }

    .main-title {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      color: #0284c7;
      text-shadow: 3px 3px 0px #ffffff, 6px 6px 0px #bae6fd;
      line-height: 1.2;
      margin-bottom: 0.4rem;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: clamp(1rem, 2.3vw, 1.25rem);
      font-weight: 800;
      color: #0369a1;
      background-color: #ffffff;
      display: inline-block;
      padding: 0.45rem 1.4rem;
      border-radius: 20px;
      border: 3px dashed #0284c7;
    }

    /* ===================================================
       3. MENU CONTAINER (3 TOMBOL SUPER CERIA 3D)
       =================================================== */
    .menu-container {
      width: 100%;
      max-width: 920px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin: auto 0;
      padding: 1rem 0;
    }

    .menu-card {
      text-decoration: none;
      border-radius: 30px;
      padding: 2.2rem 1.2rem 1.8rem 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
      position: relative;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
      overflow: hidden;
    }

    /* Efek Kilatan/Shine pada Tombol */
    .menu-card::before {
      content: '';
      position: absolute;
      top: 6px;
      left: 12px;
      right: 12px;
      height: 35%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.05));
      border-radius: 20px 20px 100px 100px;
      pointer-events: none;
    }

    /* Animation Bouncy saat Kursor Hover */
    .menu-card:hover {
      transform: translateY(-8px) scale(1.03);
    }

    .menu-card:active {
      transform: translateY(4px) scale(0.98) !important;
      box-shadow: 0 2px 0 !important;
    }

    /* VARIASI WARNA CERIA DENGAN GRADASI 3D */
    .card-materi {
      background: linear-gradient(180deg, #34d399 0%, #10b981 100%);
      border: 4px solid #059669;
      box-shadow: 0 10px 0 #047857, 0 15px 20px rgba(16, 185, 129, 0.3);
    }

    .card-game {
      background: linear-gradient(180deg, #fbbf24 0%, #f59e0b 100%);
      border: 4px solid #d97706;
      box-shadow: 0 10px 0 #b45309, 0 15px 20px rgba(245, 158, 11, 0.3);
    }

    .card-setting {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      border: 4px solid #0369a1;
      box-shadow: 0 10px 0 #075985, 0 15px 20px rgba(2, 132, 199, 0.3);
    }

    /* WADAH LOGO BULAT BERGAYA KARTUN */
    .card-icon-wrapper {
      width: 85px;
      height: 85px;
      background-color: #ffffff;
      border: 4px solid rgba(255, 255, 255, 0.9);
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.1), 0 6px 12px rgba(0, 0, 0, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      line-height: 1;
      z-index: 2;
      transition: transform 0.2s ease;
    }

    .menu-card:hover .card-icon-wrapper {
      transform: rotate(8deg) scale(1.1);
    }

    /* JUDUL MENU */
    .card-title {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.25rem, 2.2vw, 1.6rem);
      font-weight: 700;
      line-height: 1.25;
      color: #ffffff;
      text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.2);
      z-index: 2;
      letter-spacing: 0.5px;
    }

    /* ===================================================
       4. FOOTER
       =================================================== */
    .footer-text {
      margin-top: 1rem;
      font-size: 0.9rem;
      font-weight: 800;
      color: #0369a1;
      text-align: center;
      background-color: #ffffff;
      padding: 0.5rem 1.2rem;
      border-radius: 20px;
      border: 2px solid #bae6fd;
      box-shadow: 0 4px 0 #bae6fd;
    }

    /* ===================================================
       5. RESPONSIF MOBILE
       =================================================== */
    @media (max-width: 768px) {
      .menu-container {
        grid-template-columns: 1fr;
        max-width: 380px;
        gap: 1.3rem;
      }

      .menu-card {
        padding: 1.2rem 1.5rem;
        flex-direction: row;
        justify-content: flex-start;
        text-align: left;
        border-radius: 24px;
      }

      .menu-card::before {
        display: none;
      }

      .card-materi { box-shadow: 0 7px 0 #047857; }
      .card-game { box-shadow: 0 7px 0 #b45309; }
      .card-setting { box-shadow: 0 7px 0 #075985; }

      .card-icon-wrapper {
        width: 65px;
        height: 65px;
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>

  <!-- Header Utama -->
  <header class="header-container">
    <div class="badge-top">
      <span>✏️</span> Matematika SD/MI Kelas 3
    </div>
    <h1 class="main-title">Media Pembelajaran Interaktif</h1>
    <div class="subtitle">Perkalian Bilangan Cacah sampai 100</div>
  </header>

  <!-- Container 3 Tombol Berjajar 3 Kolom -->
  <main class="menu-container">
    
    <!-- Tombol 1: Materi Pembelajaran -->
    <a href="materi.html" class="menu-card card-materi">
      <div class="card-icon-wrapper">
        📖
      </div>
      <h2 class="card-title">Materi Pembelajaran</h2>
    </a>

    <!-- Tombol 2: Permainan Tug Of War (Link ke tugofwar.html) -->
    <a href="tugofwar.html" class="menu-card card-game">
      <div class="card-icon-wrapper">
        🪢
      </div>
      <h2 class="card-title">Permainan Tug Of War</h2>
    </a>

    <!-- Tombol 3: Pengaturan -->
    <a href="pengaturan.html" class="menu-card card-setting">
      <div class="card-icon-wrapper">
        ⚙️
      </div>
      <h2 class="card-title">Pengaturan</h2>
    </a>

  </main>

  <!-- Footer -->
  <footer class="footer-text">
    Buku Siswa Matematika Kelas III SD/MI &copy; Kemendikbudristek
  </footer>

  <!-- SCRIPT AUDIO SYNTHESIZER -->
  <script>
    function playClickSound() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      
      const audioCtx = new AudioContext();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.05);

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const menuCards = document.querySelectorAll('.menu-card');

      menuCards.forEach(card => {
        card.addEventListener('click', (e) => {
          playClickSound();
          
          const targetUrl = card.getAttribute('href');
          if (targetUrl) {
            e.preventDefault();
            setTimeout(() => {
              window.location.href = targetUrl;
            }, 150);
          }
        });
      });
    });
  </script>

</body>
</html>
