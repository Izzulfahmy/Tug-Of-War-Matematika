<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Pembelajaran Matematika - Perkalian Kelas 3</title>
  <!-- Google Fonts: Fredoka & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* ===================================================
       1. RESET & BASE STYLES
       =================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      /* Background Polkadot Ceria */
      background-color: #e0f2fe;
      background-image: radial-gradient(#38bdf8 1.5px, transparent 1.5px), radial-gradient(#38bdf8 1.5px, #e0f2fe 1.5px);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    /* ===================================================
       2. HEADER & JUDUL UTAMA
       =================================================== */
    .header-container {
      text-align: center;
      max-width: 800px;
      width: 100%;
      margin-bottom: 1rem;
    }

    .badge-top {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: #ffffff;
      color: #0284c7;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: clamp(0.85rem, 2vw, 1.05rem);
      padding: 0.4rem 1.2rem;
      border-radius: 50px;
      border: 3px solid #38bdf8;
      box-shadow: 0 4px 0 #0284c7;
      margin-bottom: 0.8rem;
    }

    .main-title {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.8rem, 4.5vw, 2.8rem);
      font-weight: 700;
      color: #0284c7;
      text-shadow: 3px 3px 0px #ffffff, 5px 5px 0px #bae6fd;
      line-height: 1.2;
      margin-bottom: 0.4rem;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: clamp(0.95rem, 2.2vw, 1.2rem);
      font-weight: 800;
      color: #0369a1;
      background-color: #ffffff;
      display: inline-block;
      padding: 0.4rem 1.2rem;
      border-radius: 16px;
      border: 2px dashed #0284c7;
    }

    /* ===================================================
       3. MENU CONTAINER (GRID 3 KOLOM BERJAJAR)
       =================================================== */
    .menu-container {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 3 Kolom Berjajar */
      gap: 1.5rem;
      margin: auto 0;
      padding: 1rem 0;
    }

    .menu-card {
      text-decoration: none;
      border-radius: 24px;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column; /* Logo di atas, teks di bawah */
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
      position: relative;
      transition: all 0.15s ease-in-out;
      text-align: center;
    }

    /* Efek Tekan Tombol 3D */
    .menu-card:hover {
      transform: translateY(-4px);
    }

    .menu-card:active {
      transform: translateY(4px) !important;
      box-shadow: 0 1px 0 !important;
    }

    /* Warna Tombol & Shadow 3D Presisi */
    .card-materi {
      background-color: #10b981;
      border: 4px solid #047857;
      box-shadow: 0 8px 0 #047857;
    }

    .card-game {
      background-color: #f59e0b;
      border: 4px solid #b45309;
      box-shadow: 0 8px 0 #b45309;
    }

    .card-setting {
      background-color: #0284c7;
      border: 4px solid #0369a1;
      box-shadow: 0 8px 0 #0369a1;
    }

    /* WADAH LOGO/IKON DI ATAS */
    .card-icon-wrapper {
      width: 75px;
      height: 75px;
      background-color: rgba(255, 255, 255, 0.25);
      border: 3px solid rgba(255, 255, 255, 0.6);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      line-height: 1;
    }

    /* JUDUL MENU */
    .card-title {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.2rem, 2vw, 1.5rem);
      font-weight: 600;
      line-height: 1.2;
      color: #ffffff;
      text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.15);
    }

    /* ===================================================
       4. FOOTER
       =================================================== */
    .footer-text {
      margin-top: 1rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: #0369a1;
      text-align: center;
      background-color: rgba(255, 255, 255, 0.6);
      padding: 0.4rem 1rem;
      border-radius: 20px;
    }

    /* ===================================================
       5. RESPONSIF MOBILE
       =================================================== */
    @media (max-width: 768px) {
      .menu-container {
        grid-template-columns: 1fr; /* Become 1 column on Mobile */
        max-width: 380px;
        gap: 1.2rem;
      }

      .menu-card {
        padding: 1.5rem 1rem;
        flex-direction: row;
        justify-content: flex-start;
        text-align: left;
      }

      .card-icon-wrapper {
        width: 60px;
        height: 60px;
        font-size: 2rem;
        border-radius: 18px;
      }
    }
  </style>
</head>
<body>

  <!-- Header Utama -->
  <header class="header-container">
    <div class="badge-top">
      <span>✏️</span> Matematika SD/MI Kelas 3
    </div>
    <h1 class="main-title">Media Pembelajaran Interaktif</h1>
    <div class="subtitle">Perkalian Bilangan Cacah sampai 100</div>
  </header>

  <!-- Container 3 Tombol Berjajar 3 Kolom -->
  <main class="menu-container">
    
    <!-- Tombol 1: Materi Pembelajaran -->
    <a href="materi.html" class="menu-card card-materi">
      <div class="card-icon-wrapper">
        📖
      </div>
      <h2 class="card-title">Materi Pembelajaran</h2>
    </a>

    <!-- Tombol 2: Permainan Tug Of War -->
    <a href="tug-of-war.html" class="menu-card card-game">
      <div class="card-icon-wrapper">
        🪢
      </div>
      <h2 class="card-title">Permainan Tug Of War</h2>
    </a>

    <!-- Tombol 3: Pengaturan -->
    <a href="pengaturan.html" class="menu-card card-setting">
      <div class="card-icon-wrapper">
        ⚙️
      </div>
      <h2 class="card-title">Pengaturan</h2>
    </a>

  </main>

  <!-- Footer -->
  <footer class="footer-text">
    Buku Siswa Matematika Kelas III SD/MI &copy; Kemendikbudristek
  </footer>

  <!-- SCRIPT AUDIO SYNTHESIZER (OPSI 1) -->
  <script>
    // Fungsi untuk memutar suara 'click/pop' interaktif menggunakan Web Audio API
    function playClickSound() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      
      const audioCtx = new AudioContext();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      // Mengatur jenis gelombang dan frekuensi nada (600Hz ke 1200Hz)
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.05);

      // Pengaturan volume yang memudar secara instan
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    // Menghubungkan fungsi audio ke setiap tombol menu
    document.addEventListener('DOMContentLoaded', () => {
      const menuCards = document.querySelectorAll('.menu-card');

      menuCards.forEach(card => {
        card.addEventListener('click', (e) => {
          playClickSound();
          
          // Memberikan sedikit jeda (150ms) agar efek suara klik terdengar sebelum pindah halaman
          const targetUrl = card.getAttribute('href');
          if (targetUrl) {
            e.preventDefault();
            setTimeout(() => {
              window.location.href = targetUrl;
            }, 150);
          }
        });
      });
    });
  </script>

</body>
</html>
